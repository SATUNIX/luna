<title id="t">Luna, the pi agent system</title>
<desc id="d">A pi session under Luna: reads, edits and tests are allowed, a reviewer sub-agent is delegated, rm -rf ~ is denied, a force push waits for your approval, and the checks finish with recorded evidence.</desc>
