<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">Nothing counts as done unverified</title>
<desc id="d">A change goes to the checks. On the first pass lint fails and the work loops back for a fix; on the second pass tests, lint and types all pass and the work is marked done, with the evidence recorded.</desc>
