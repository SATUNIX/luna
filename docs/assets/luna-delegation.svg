<title id="t">Delegation stays bounded</title>
<desc id="d">You give the lead agent a task and a budget. It hands a read-only scout a bounded question and a reviewer a diff; each returns its findings or verdict, the budget meter drains, and the lead reports back with evidence.</desc>
