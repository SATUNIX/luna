<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
<title id="t">Seven profiles in one package</title>
<desc id="d">The five Luna profiles, highlighted one after another with what each is for: balanced (the default), long-horizon, self-improving, engagement and lite.</desc>
<style>svg{background:#ECECEA}.sans{font-family:Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif}.mono{font-family:'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace}.micro{font-family:'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:13px;font-weight:600;letter-spacing:0.04em}@media (prefers-reduced-motion:reduce){*{animation-delay:-3s!important;animation-play-state:paused!important}}@keyframes k1{0%{opacity:0}0%{opacity:1}20%{opacity:0}100%{opacity:0}}.k1{animation:k1 10s step-end infinite}@keyframes k2{0%{opacity:0}20%{opacity:1}40%{opacity:0}100%{opacity:0}}.k2{animation:k2 10s step-end infinite}@keyframes k3{0%{opacity:0}40%{opacity:1}60%{opacity:0}100%{opacity:0}}.k3{animation:k3 10s step-end infinite}@keyframes k4{0%{opacity:0}60%{opacity:1}80%{opacity:0}100%{opacity:0}}.k4{animation:k4 10s step-end infinite}@keyframes k5{0%{opacity:0}80%{opacity:1}100%{opacity:0}100%{opacity:0}}.k5{animation:k5 10s step-end infinite}</style>
<rect width="1200" height="300" fill="#ECECEA"/>
<text x="40" y="50" class="mono" font-size="22" font-weight="700" fill="#000000">/profile</text>
<text x="1160" y="48" class="micro" text-anchor="end" fill="#55554F">ONE PACKAGE · FIVE PROFILES</text>
<path d="M0 74H1200" stroke="#000000" stroke-width="2"/>
<rect x="40" y="104" width="224" height="96" fill="#F5F5F3" stroke="#000000" stroke-width="2"/>
<rect class="k1" x="40" y="104" width="224" height="96" fill="#C4FF0D" stroke="#000000" stroke-width="2"/>
<text x="54" y="132" class="micro" fill="#55554F">01</text>
<text x="54" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">balanced</text>
<g class="k1"><text x="54" y="132" class="micro" fill="#000000">01</text><text x="54" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">balanced</text></g>
<g class="k1"><text x="40" y="246" class="sans" font-size="22" fill="#000000">Everyday work with verification and context helpers (the default).</text><text x="1160" y="246" class="mono" font-size="17" text-anchor="end" fill="#4F00FF">/profile balanced</text></g>
<rect x="264" y="104" width="224" height="96" fill="#F5F5F3" stroke="#000000" stroke-width="2"/>
<rect class="k2" x="264" y="104" width="224" height="96" fill="#C4FF0D" stroke="#000000" stroke-width="2"/>
<text x="278" y="132" class="micro" fill="#55554F">02</text>
<text x="278" y="178" class="sans" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#000000">long-horizon</text>
<g class="k2"><text x="278" y="132" class="micro" fill="#000000">02</text><text x="278" y="178" class="sans" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#000000">long-horizon</text></g>
<g class="k2"><text x="40" y="246" class="sans" font-size="22" fill="#000000">Multi-hour work and unattended runs: goals, task graph, branches, delegation.</text><text x="1160" y="246" class="mono" font-size="17" text-anchor="end" fill="#4F00FF">/profile long-horizon</text></g>
<rect x="488" y="104" width="224" height="96" fill="#F5F5F3" stroke="#000000" stroke-width="2"/>
<rect class="k3" x="488" y="104" width="224" height="96" fill="#C4FF0D" stroke="#000000" stroke-width="2"/>
<text x="502" y="132" class="micro" fill="#55554F">03</text>
<text x="502" y="178" class="sans" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#000000">self-improving</text>
<g class="k3"><text x="502" y="132" class="micro" fill="#000000">03</text><text x="502" y="178" class="sans" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#000000">self-improving</text></g>
<g class="k3"><text x="40" y="246" class="sans" font-size="22" fill="#000000">Research use: memory services, dual review and skill mining.</text><text x="1160" y="246" class="mono" font-size="17" text-anchor="end" fill="#4F00FF">/profile self-improving</text></g>
<rect x="712" y="104" width="224" height="96" fill="#F5F5F3" stroke="#000000" stroke-width="2"/>
<rect class="k4" x="712" y="104" width="224" height="96" fill="#C4FF0D" stroke="#000000" stroke-width="2"/>
<text x="726" y="132" class="micro" fill="#55554F">04</text>
<text x="726" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">engagement</text>
<g class="k4"><text x="726" y="132" class="micro" fill="#000000">04</text><text x="726" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">engagement</text></g>
<g class="k4"><text x="40" y="246" class="sans" font-size="22" fill="#000000">Authorised engagements: strict firewall policy, scope and rules.</text><text x="1160" y="246" class="mono" font-size="17" text-anchor="end" fill="#4F00FF">/profile engagement</text></g>
<rect x="936" y="104" width="224" height="96" fill="#F5F5F3" stroke="#000000" stroke-width="2"/>
<rect class="k5" x="936" y="104" width="224" height="96" fill="#C4FF0D" stroke="#000000" stroke-width="2"/>
<text x="950" y="132" class="micro" fill="#55554F">05</text>
<text x="950" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">lite</text>
<g class="k5"><text x="950" y="132" class="micro" fill="#000000">05</text><text x="950" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">lite</text></g>
<g class="k5"><text x="40" y="246" class="sans" font-size="22" fill="#000000">Quick tasks, small local models and short contexts.</text><text x="1160" y="246" class="mono" font-size="17" text-anchor="end" fill="#4F00FF">/profile lite</text></g>
<rect x="1" y="1" width="1198" height="298" fill="none" stroke="#000000" stroke-width="2"/>
</svg>
