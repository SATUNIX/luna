<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
<title id="t">Every tool call meets the gate</title>
<desc id="d">Three tool calls pass through the Luna firewall: a file read is allowed, a git push waits for your approval and then runs, and a destructive delete is denied. Each decision is written to the audit record.</desc>
