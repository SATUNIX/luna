name: ci

# The functional gate. Security scanning lives in security.yml; publishing in release.yml.
# Actions are pinned to full commit SHAs (Dependabot keeps them current) and every job runs
# with a read-only token.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      # Lifecycle scripts never run in CI: a compromised dependency cannot execute on install.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run -s security:lockfile
      # One definition of done: check:all enumerates verify, eval, docs:check, every
      # smoke:*/test:* script (including smoke:package, the published-tarball check, and
      # smoke:clean-install, which installs that tarball and starts the real pi) and
      # profile:check per profile from package.json, so a new check is picked up without
      # editing this workflow. It also fails on a test file no script runs (smoke:wiring),
      # so a green run cannot hide an unwired suite.
      - run: npm run -s check:all

  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # Every package in the docs toolchain is pinned and hashed (requirements-docs.txt is generated
      # from requirements-docs.in by pip-compile --generate-hashes); pip refuses anything else.
      - run: python -m pip install --user --require-hashes -r requirements-docs.txt
      - run: python -m mkdocs build --strict

  # Every profile loads on Linux and Windows.
  profile-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [quick, balanced, long-horizon, autonomous, self-improving, pentest, lite]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # bash on both runners, so "$PROFILE" expands the same way on Windows.
      - run: npm run profile:check -- --profile "$PROFILE"
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}

  # Version pin discipline. devDependencies pin the tested version (the `verify` job runs against
  # it); this matrix runs the whole check suite at the supported FLOOR and at the last pi 0.x
  # release (both must pass: pi 1.x dropped its shrinkwrap and changed extension events, so the
  # pre-1.0 line is checked explicitly). These lanes run on Node 22, the engines floor, while
  # `verify` and `profile-regression` run on the newest Node line. An advisory lane returns when a
  # pi release newer than the pin is under review; its failure is the signal to review before the
  # pin moves.
  pi-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pi: "0.85.1"
            advisory: false
          - pi: "0.99.2"
            advisory: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Installing outside the lockfile is the point of this job: it runs the suite against a pi version other than the pinned one.
      # The version is a literal from the matrix above, passed through the environment rather than spliced into the script.
      # Every pi package the kit imports is named, so npm puts this version's copy at the root; one left out stays
      # at the pinned version or is nested under pi and pruned from the root (tests/pi-host-peers-smoke.ts).
      - run: >- # zizmor: ignore[adhoc-packages]
          npm install --no-save --ignore-scripts --no-audit --no-fund
          "@earendil-works/pi-coding-agent@${PI_VERSION}"
          "@earendil-works/pi-ai@${PI_VERSION}"
          "@earendil-works/pi-tui@${PI_VERSION}"
        env:
          PI_VERSION: ${{ matrix.pi }}
      # The tarball check does not depend on the pi version. Type checking and lint read pi's type
      # declarations, whose exported names change between releases; the verify job runs them against
      # the pinned version. Extensions load as erased TypeScript, so everything else runs here.
      - run: npm run -s check:all -- --skip=smoke:package,test:typecheck,test:lint

  # The Android companion app (apps/android). The Gradle wrapper jar must be the one Gradle
  # publishes for the wrapper's version (the checksum is fetched from services.gradle.org, the
  # same check gradle/actions/wrapper-validation makes), then the debug build and Android lint run
  # with the SDK packages the app's README names. No Gradle cache: nothing from an earlier run
  # reaches the build.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gradle wrapper jar is the published one
        working-directory: apps/android
        run: |
          version="$(sed -n 's#^distributionUrl=.*/gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip$#\1#p' gradle/wrapper/gradle-wrapper.properties)"
          test -n "$version"
          grep -q '^distributionSha256Sum=[0-9a-f]\{64\}$' gradle/wrapper/gradle-wrapper.properties
          expected="$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")"
          echo "${expected}  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - name: Build and lint
        working-directory: apps/android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon --no-build-cache --console=plain assembleDebug lintDebug

  # The one required check for this workflow: it succeeds only when every job above
  # succeeded, so a new job or matrix lane is gated by adding it to `needs` here rather than by
  # editing the repository ruleset. tests/workflow-policy-smoke.ts checks that `needs` names every
  # other job.
  ci-complete:
    if: always()
    needs: [verify, docs-build, profile-regression, pi-compat, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then echo "a needed job ended: $result"; exit 1; fi
          done
