name: pi-system

services:
  pi-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PI_CODING_AGENT_VERSION: ${PI_CODING_AGENT_VERSION:-1.4.0}
        PI_MCP_ADAPTER_VERSION: ${PI_MCP_ADAPTER_VERSION:-6.0.0}
    image: ${PI_AGENT_IMAGE:-pi-system:local}
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      HOME: /srv/data/pi-system/home
      PI_AGENT_DATA_ROOT: /srv/data/pi-system
      PI_AGENT_HEALTH_PORT: ${APP_PORT:-8080}
      PI_CODING_AGENT_DIR: /srv/data/pi-system/pi-agent
      PI_CODING_AGENT_SESSION_DIR: /srv/data/pi-system/sessions
      PI_KIT_MEMORY_BACKEND: ${PI_KIT_MEMORY_BACKEND:-mcp}
      PI_KIT_MEMORY_MCP_ARGS: ${PI_KIT_MEMORY_MCP_ARGS:-/opt/pi-agent/mcp-servers/memory-mcp/index.ts}
      PI_KIT_MEMORY_MCP_COMMAND: ${PI_KIT_MEMORY_MCP_COMMAND:-node}
      PI_KIT_MEMORY_MCP_DATA_ROOT: /srv/data/pi-system
      PI_OFFLINE: ${PI_OFFLINE:-0}
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      PI_KIT_PROFILE: ${PI_KIT_PROFILE:-balanced}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${PI_AGENT_DATA_ROOT:-/srv/data/pi-system}
        target: /srv/data/pi-system
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "/opt/pi-agent/healthcheck.py", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: ${MEM_LIMIT:-2g}
    cpus: ${CPUS:-2.00}
    read_only: true
    tmpfs:
      - /tmp
