name: security

# SAST, secret scanning, dependency and supply-chain checks, and a security audit of the
# workflows themselves. Findings go to the repository's Security tab (code scanning) as SARIF
# where the tool supports it. Runs on every push to main, every PR, and weekly, so new
# advisories against unchanged code are still caught.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # SAST: GitHub CodeQL with the extended security query suite (JS/TS extensions and tooling).
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript, actions
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  # SAST: Semgrep community rules for JS/TS/Node, secrets and the OWASP top ten. Blocks on
  # ERROR-severity findings; everything is uploaded for triage. Scope: .semgrepignore.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    container:
      # Pinned by digest (the tag is only a label; it can be moved).
      image: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          semgrep scan --metrics=off
          --config p/javascript --config p/typescript --config p/nodejs
          --config p/secrets --config p/owasp-top-ten
          --sarif --output semgrep.sarif
      # Semgrep keeps `nosemgrep`-suppressed findings in SARIF (marked `suppressions`), and code
      # scanning raises them as alerts anyway; drop them so a reviewed suppression stays quiet, but
      # list every one in the job summary so a suppression is never invisible. Each inline
      # suppression is also recorded in packages/core/scan-suppressions.json
      # (tests/suppression-inventory-smoke.ts).
      - name: Move suppressed results to the job summary
        run: |
          python3 - <<'PY'
          import json, os
          path = "semgrep.sarif"
          with open(path) as f:
              data = json.load(f)
          suppressed = []
          for run in data["runs"]:
              kept = []
              for result in run.get("results", []):
                  if result.get("suppressions"):
                      loc = (result.get("locations") or [{}])[0].get("physicalLocation", {})
                      where = "%s:%s" % (loc.get("artifactLocation", {}).get("uri", "?"), loc.get("region", {}).get("startLine", "?"))
                      suppressed.append("| `%s` | `%s` |" % (result.get("ruleId", "?"), where))
                  else:
                      kept.append(result)
              run["results"] = kept
          with open(path, "w") as f:
              json.dump(data, f)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Semgrep: %d suppressed result(s)\n\n" % len(suppressed))
              if suppressed:
                  f.write("| Rule | Location |\n|---|---|\n" + "\n".join(suppressed) + "\n")
          PY
      - if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - run: >-
          semgrep scan --metrics=off --severity ERROR --error
          --config p/javascript --config p/typescript --config p/nodejs
          --config p/secrets --config p/owasp-top-ten

  # Secret scanning over the FULL git history, with the repository's .gitleaks.toml (default
  # rules plus path-bound [[allowlists]] for synthetic test fixtures: with condition = "AND", a
  # finding is allowed only when its file matches the allowlist's paths and its line matches its
  # regexes). The binary is fetched from the upstream release and verified against a pinned
  # checksum.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - run: ./gitleaks git --redact --verbose --exit-code 1 .

  # Dependencies: known vulnerabilities (npm audit, OSV), registry signatures and provenance
  # attestations (npm audit signatures), and lockfile integrity.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run -s security:lockfile
      - run: npm audit signatures
      # The published package has no runtime dependencies; everything audited here is the
      # dev toolchain (the pi framework, TypeScript, ajv). High and critical findings fail the
      # job; triage accepted upstream advisories in docs/supply-chain.md.
      - run: npm audit --audit-level=high
      # Every other lockfile lockfile-check discovers (the MCP servers the container installs),
      # each installed without scripts and audited where it lives. The list is captured by a
      # checked assignment: `--list` exits non-zero on an error or when it finds no lockfile, and a
      # failing command substitution in the `for` line would be ignored.
      - name: Audit every other lockfile
        run: |
          locks="$(node packages/core/lockfile-check.ts --list)"
          for lock in $locks; do
            dir="$(dirname "$lock")"
            if [ "$dir" = "." ]; then continue; fi
            echo "::group::$dir"
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund && npm audit signatures && npm audit --audit-level=high)
            echo "::endgroup::"
          done

  # Property-based fuzzing, long form. check:all runs the same tests on every change with a fixed
  # seed and a few hundred cases each; the weekly run uses a fresh random seed and many more cases,
  # so it explores inputs no earlier run tried. A failure prints the seed that reproduces it
  # (docs/ci-security.md, "Property-based fuzzing").
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run -s smoke:fuzz-firewall-classifier
        env:
          FUZZ_SEED: random
          FUZZ_RUNS: "200000"
      - run: npm run -s smoke:fuzz-redaction
        env:
          FUZZ_SEED: random
          FUZZ_RUNS: "200000"
      - run: npm run -s smoke:fuzz-workspace-paths
        env:
          FUZZ_SEED: random
          FUZZ_RUNS: "20000"

  # Every manifest in the tree, not only the root lockfile: the MCP server lockfiles under
  # packages/container/mcp-servers and requirements-docs.txt are scanned too, and a lockfile
  # added later is picked up without editing this job.
  osv-scanner:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --recursive
        ./

  # PRs only: block a change that introduces a dependency with a known high-severity
  # vulnerability or a license outside the allowlist.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only: the result is in the job summary rather than a PR comment, so the release
    # workflow can call this workflow without granting pull-requests: write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Python-2.0, Unlicense
          # Per-package, per-version exceptions, each reviewed against the package tarball:
          # json-schema-typed 8.0.2 (pulled in by @modelcontextprotocol/sdk) is BSD-2-Clause code; the
          # detected "AND JSON" comes from the IETF JSON Schema description text it bundles.
          # bowser 2.14.1 (pulled in by @aws-sdk/core in the container tool lockfiles) is MIT; the
          # detected "AND MITNFA" is its added clause asking modified copies to drop the author's
          # bug-report contacts. pathspec 1.1.1 is MPL-2.0 and is only a docs-build dependency
          # (requirements-docs.txt, used by MkDocs), never shipped in the package or an image.
          allow-dependencies-licenses: pkg:npm/json-schema-typed@8.0.2, pkg:npm/bowser@2.14.1, pkg:pypi/pathspec@1.1.1
          comment-summary-in-pr: never

  # PRs only: the pre-push leak scan over the pull request's commits, exactly as the hook runs it,
  # with the exceptions read from the base branch (a contributor without the hook, or a push with
  # --no-verify, is still checked before merge). A match admitted only by an exception this pull
  # request adds fails, and so does a change to packages/core/leak-scan-exceptions.json mixed with
  # other files: new exceptions land in their own pull request first. There is no bypass for
  # release branches: any change to exceptions lands in an exceptions-only pull request first,
  # then the release branch updates from main (docs/releasing.md, "Releases that change scan exceptions").
  leak-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Leak scan of the pull request's commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node packages/core/prepush-scan.ts range --base "origin/${BASE_REF}" "origin/${BASE_REF}..HEAD"

  # The workflows are code too: template injection, over-broad permissions, credential
  # persistence, unpinned actions, dangerous triggers.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
