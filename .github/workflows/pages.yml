name: pages

# The project website (docs/website.md): website/ assembled by packages/core/build-site.ts, the
# documentation built by mkdocs into /docs/. A push to main (or a manual run on main) builds it and
# deploys it to GitHub Pages. Pushing a release tag does not run it (the github-pages environment
# deploys from main only), so the release steps re-run it by hand on main once the tag is pushed
# (docs/releasing.md); until then the page keeps the previous tag and the build prints a warning. It never runs on a pull request: ci.yml checks the same build there
# (smoke:site builds the page and checks the illustrations; docs-build runs mkdocs --strict), so no
# pull request can reach the deploy job's rights (tests/release-workflow-smoke.ts).
#
# Actions are pinned to full commit SHAs (Dependabot keeps them current). The token is read-only
# except in `deploy`, the only job with `pages: write` and `id-token: write` (what
# actions/deploy-pages needs), which runs in the `github-pages` environment declared in
# .github/expected-settings.json and has no checkout, so no repository code runs with them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel one half way.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The full history and its tags: the page names the newest pushed v* tag merged into main,
      # never a package.json version whose tag is not pushed yet (packages/core/build-site.ts).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # The same hashed docs toolchain as ci.yml's docs-build; pip refuses anything else.
      - run: python -m pip install --user --require-hashes -r requirements-docs.txt
      # Neither script needs a dependency install: they import only Node built-ins and core/lib.
      - run: node packages/core/readme-art.ts --check
      - run: node packages/core/build-site.ts --out _site
      - run: python -m mkdocs build --strict --site-dir _site/docs
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy the uploaded site to GitHub Pages
      id-token: write # actions/deploy-pages proves the deployment's origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
