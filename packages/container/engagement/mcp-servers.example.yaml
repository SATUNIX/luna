schema_version: 1

notes:
  - Pi uses pi-mcp-adapter and reads .mcp.json or .pi/mcp.json.
  - Keep directTools false by default so MCP stays behind the governed proxy tool.
  - Keep sampling false and samplingAutoApprove false unless a separate approval design exists.
  - Keep pi_system_governance enabled; it provides local evidence, note, checkpoint, task, memory, and verification tools.
  - Burp MCP is expected at host.docker.internal from inside the container.

mcp_servers:
  pi_system_governance:
    enabled: true
    transport: stdio
    command: node
    args:
      - /workspace/.pi/mcp-servers/governance/index.ts
    lifecycle: lazy
    directTools: false
    sampling: false
    samplingAutoApprove: false
    autoAuth: false
    elicitation: false
    elicitationAutoOpenUrls: false
    risk_default: unknown

  burp:
    enabled: true
    transport: streamable-http
    url: http://host.docker.internal:9876/mcp
    lifecycle: lazy
    directTools: false
    sampling: false
    samplingAutoApprove: false
    risk_default: unknown

  burp_stdio_example:
    enabled: false
    transport: stdio
    command: burp-mcp-server
    args: []
    lifecycle: lazy
    directTools: false
    sampling: false
    samplingAutoApprove: false
    risk_default: unknown
