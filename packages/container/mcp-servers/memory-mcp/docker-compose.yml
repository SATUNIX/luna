name: pi-kit-memory-mcp

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - type: volume
        source: qdrant-data
        target: /qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-data:
