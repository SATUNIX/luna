<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
<title id="t">Seven profiles in one package</title>
<desc id="d">The seven Luna profiles, highlighted one after another with what each is for: quick, balanced (the default), long-horizon, autonomous, self-improving, pentest and lite.</desc>
<style>svg{background:#ECECEA}.sans{font-family:Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif}.mono{font-family:'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace}.micro{font-family:'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:13px;font-weight:600;letter-spacing:0.04em}@media (prefers-reduced-motion:reduce){*{animation-delay:-3s!important;animation-play-state:paused!important}}@keyframes k1{0%{opacity:0}0%{opacity:1}14.29%{opacity:0}100%{opacity:0}}.k1{animation:k1 14s step-end infinite}@keyframes k2{0%{opacity:0}14.29%{opacity:1}28.57%{opacity:0}100%{opacity:0}}.k2{animation:k2 14s step-end infinite}@keyframes k3{0%{opacity:0}28.57%{opacity:1}42.86%{opacity:0}100%{opacity:0}}.k3{animation:k3 14s step-end infinite}@keyframes k4{0%{opacity:0}42.86%{opacity:1}57.14%{opacity:0}100%{opacity:0}}.k4{animation:k4 14s step-end infinite}@keyframes k5{0%{opacity:0}57.14%{opacity:1}71.43%{opacity:0}100%{opacity:0}}.k5{animation:k5 14s step-end infinite}@keyframes k6{0%{opacity:0}71.43%{opacity:1}85.71%{opacity:0}100%{opacity:0}}.k6{animation:k6 14s step-end infinite}@keyframes k7{0%{opacity:0}85.71%{opacity:1}100%{opacity:0}100%{opacity:0}}.k7{animation:k7 14s step-end infinite}</style>
<rect width="1200" height="300" fill="#ECECEA"/>
<text x="40" y="50" class="mono" font-size="22" font-weight="700" fill="#000000">/profile</text>
<text x="1160" y="48" class="micro" text-anchor="end" fill="#55554F">ONE PACKAGE · SEVEN PROFILES</text>
<path d="M0 74H1200" stroke="#000000" stroke-width="2"/>
<rect x="40" y="104" width="160" height="96" fill="#F5F5F3" stroke="#000000" stroke-width="2"/>
<rect class="k1" x="40" y="104" width="160" height="96" fill="#C4FF0D" stroke="#000000" stroke-width="2"/>
<text x="54" y="132" class="micro" fill="#55554F">01</text>
<text x="54" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">quick</text>
<g class="k1"><text x="54" y="132" class="micro" fill="#000000">01</text><text x="54" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">quick</text></g>
<g class="k1"><text x="40" y="246" class="sans" font-size="22" fill="#000000">Fast edits with the safety guards and checkpoints, no ceremony.</text><text x="1160" y="246" class="mono" font-size="17" text-anchor="end" fill="#4F00FF">/profile quick</text></g>
<rect x="200" y="104" width="160" height="96" fill="#F5F5F3" stroke="#000000" stroke-width="2"/>
<rect class="k2" x="200" y="104" width="160" height="96" fill="#C4FF0D" stroke="#000000" stroke-width="2"/>
<text x="214" y="132" class="micro" fill="#55554F">02</text>
<text x="214" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">balanced</text>
<g class="k2"><text x="214" y="132" class="micro" fill="#000000">02</text><text x="214" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">balanced</text></g>
<g class="k2"><text x="40" y="246" class="sans" font-size="22" fill="#000000">Everyday work with verification and context helpers (the default).</text><text x="1160" y="246" class="mono" font-size="17" text-anchor="end" fill="#4F00FF">/profile balanced</text></g>
<rect x="360" y="104" width="160" height="96" fill="#F5F5F3" stroke="#000000" stroke-width="2"/>
<rect class="k3" x="360" y="104" width="160" height="96" fill="#C4FF0D" stroke="#000000" stroke-width="2"/>
<text x="374" y="132" class="micro" fill="#55554F">03</text>
<text x="374" y="178" class="sans" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#000000">long-horizon</text>
<g class="k3"><text x="374" y="132" class="micro" fill="#000000">03</text><text x="374" y="178" class="sans" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#000000">long-horizon</text></g>
<g class="k3"><text x="40" y="246" class="sans" font-size="22" fill="#000000">Multi-hour work: goals, task graph, branches, delegation.</text><text x="1160" y="246" class="mono" font-size="17" text-anchor="end" fill="#4F00FF">/profile long-horizon</text></g>
<rect x="520" y="104" width="160" height="96" fill="#F5F5F3" stroke="#000000" stroke-width="2"/>
<rect class="k4" x="520" y="104" width="160" height="96" fill="#C4FF0D" stroke="#000000" stroke-width="2"/>
<text x="534" y="132" class="micro" fill="#55554F">04</text>
<text x="534" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">autonomous</text>
<g class="k4"><text x="534" y="132" class="micro" fill="#000000">04</text><text x="534" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">autonomous</text></g>
<g class="k4"><text x="40" y="246" class="sans" font-size="22" fill="#000000">Long-running sessions, including unattended runs.</text><text x="1160" y="246" class="mono" font-size="17" text-anchor="end" fill="#4F00FF">/profile autonomous</text></g>
<rect x="680" y="104" width="160" height="96" fill="#F5F5F3" stroke="#000000" stroke-width="2"/>
<rect class="k5" x="680" y="104" width="160" height="96" fill="#C4FF0D" stroke="#000000" stroke-width="2"/>
<text x="694" y="132" class="micro" fill="#55554F">05</text>
<text x="694" y="178" class="sans" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#000000">self-improving</text>
<g class="k5"><text x="694" y="132" class="micro" fill="#000000">05</text><text x="694" y="178" class="sans" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#000000">self-improving</text></g>
<g class="k5"><text x="40" y="246" class="sans" font-size="22" fill="#000000">Research use: memory services, dual review and skill mining.</text><text x="1160" y="246" class="mono" font-size="17" text-anchor="end" fill="#4F00FF">/profile self-improving</text></g>
<rect x="840" y="104" width="160" height="96" fill="#F5F5F3" stroke="#000000" stroke-width="2"/>
<rect class="k6" x="840" y="104" width="160" height="96" fill="#C4FF0D" stroke="#000000" stroke-width="2"/>
<text x="854" y="132" class="micro" fill="#55554F">06</text>
<text x="854" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">pentest</text>
<g class="k6"><text x="854" y="132" class="micro" fill="#000000">06</text><text x="854" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">pentest</text></g>
<g class="k6"><text x="40" y="246" class="sans" font-size="22" fill="#000000">Authorised engagements: strict firewall policy, scope and rules.</text><text x="1160" y="246" class="mono" font-size="17" text-anchor="end" fill="#4F00FF">/profile pentest</text></g>
<rect x="1000" y="104" width="160" height="96" fill="#F5F5F3" stroke="#000000" stroke-width="2"/>
<rect class="k7" x="1000" y="104" width="160" height="96" fill="#C4FF0D" stroke="#000000" stroke-width="2"/>
<text x="1014" y="132" class="micro" fill="#55554F">07</text>
<text x="1014" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">lite</text>
<g class="k7"><text x="1014" y="132" class="micro" fill="#000000">07</text><text x="1014" y="178" class="sans" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#000000">lite</text></g>
<g class="k7"><text x="40" y="246" class="sans" font-size="22" fill="#000000">Small local models and short contexts.</text><text x="1160" y="246" class="mono" font-size="17" text-anchor="end" fill="#4F00FF">/profile lite</text></g>
<rect x="1" y="1" width="1198" height="298" fill="none" stroke="#000000" stroke-width="2"/>
</svg>
