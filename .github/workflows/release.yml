name: release

# MANUAL. Nothing here runs on push, on a tag or on a pull request: it only runs when an operator
# starts it from the Actions tab (workflow_dispatch), and the default is a DRY RUN.
#
# The primary public delivery is git: a pushed `vX.Y.Z[-pre.N]` tag IS the release for
# `pi install git:github.com/SATUNIX/pi-system@vX.Y.Z` and the `latest` channel
# (packages/core/distribution.json). This workflow adds two optional, explicitly authorised
# extras on top of a tag:
#   - a GitHub Release with the CHANGELOG notes, and
#   - publishing @satunix/pi-system to npm (trusted publishing, OIDC; no npm token is stored).
#
# Side effects are confined to two jobs, each of which needs `inputs.dry-run == false` (an
# explicit boolean comparison, so any other event type or an empty input also means "no side
# effects"):
#   github-release   creates the GitHub Release           (contents: write)
#   npm-publish      runs `npm publish`, needs also        (id-token: write, `npm` environment)
#                    `inputs.publish-npm == true`
# Every other job has read-only permissions and cannot create a release, publish or push.
# tests/release-workflow-smoke.ts checks this structure statically.
#
# Nothing releases unless the full CI gate passes for the same commit.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: build and inspect everything, publish and release nothing. Untick to create the GitHub Release for the selected tag."
        type: boolean
        default: true
      publish-npm:
        description: "Also publish to npm (only with dry-run unticked, from a tag; needs the npm trusted publisher and the `npm` environment)."
        type: boolean
        default: false

permissions: {}

# Never cancel a release half way; serialise per ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Side-effect free: plans the version, proves the tarball and `npm publish` would work, and
  # prints what a release would contain. Read-only token, no environment, no secrets.
  plan:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          # No dependency cache: a poisoned cache must never influence a release.
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund

      # A release tag must point at a commit on main, so a tag pushed from an unreviewed
      # branch can never release.
      - name: Tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Plan version and dist-tag
        id: plan
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          # A dry run may be started from a release branch: plan it as the tag it would become.
          if [[ "$REF" != refs/tags/v* && "$REF" != "refs/heads/main" ]]; then
            if [ "$DRY_RUN" != "true" ]; then echo "A real release must run from a v* tag, not $REF"; exit 1; fi
            REF="refs/tags/v$(node -p "require('./package.json').version")"
            echo "dry run from $GITHUB_REF: planning as $REF"
          fi
          tags="$(npm view @satunix/pi-system dist-tags --json 2>/dev/null || echo '{}')"
          node packages/core/publish-plan.ts --ref "$REF" --sha "$SHA" --dist-tags "$tags" --write | tee -a "$GITHUB_OUTPUT"

      - name: Package check
        run: node packages/core/pack-check.ts

      # Node will not strip types under node_modules, so the npm artefact is compiled
      # (internal/docs/adr/0001). Every later npm command works on the staged copy.
      - name: Build the npm artefact
        run: node packages/core/build-npm.ts

      - name: Reproducible tarball
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          npm pack ./dist/npm --ignore-scripts --json > pack.json
          {
            echo "### Release candidate ${VERSION}"
            echo
            node -e 'const p=require("./pack.json")[0]; console.log(`- tarball: \`${p.filename}\`, ${p.files.length} files, ${p.size} bytes packed, ${p.unpackedSize} unpacked`); console.log(`- sha512: \`${p.integrity}\``)'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # `--dry-run` uploads nothing. This is the only npm command in this job.
      - name: npm publish (dry run only)
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: npm publish ./dist/npm --dry-run --access public --tag "$TAG" --ignore-scripts

      - name: Release notes preview
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node packages/core/release-notes.ts "$VERSION" --out release-notes.md
          { echo "### Release notes"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == false && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node packages/core/release-notes.ts "$VERSION" --out release-notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          flags=(--latest)
          if [ "$TAG" != "latest" ] || [[ "$VERSION" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md --verify-tag "${flags[@]}"

  npm-publish:
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == false && inputs.publish-npm == true && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@satunix/pi-system
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm >= 11.5.1; Node 24's bundled npm has it. Fail loudly
      # rather than installing npm ad hoc outside the lockfile.
      - name: npm supports trusted publishing
        run: |
          v="$(npm --version)"; echo "npm $v"
          printf '%s\n' 11.5.1 "$v" | sort -V -C || { echo "npm $v < 11.5.1"; exit 1; }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the npm artefact
        run: node packages/core/build-npm.ts
      - name: Skip if already published
        id: exists
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if npm view "@satunix/pi-system@${VERSION}" version >/dev/null 2>&1; then
            echo "@satunix/pi-system@${VERSION} is already on npm; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.exists.outputs.published == 'false'
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          # Only the very first publish needs a token (a package must exist before a trusted
          # publisher can be attached); leave the secret unset afterwards and OIDC is used.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./dist/npm --provenance --access public --tag "$TAG" --ignore-scripts
